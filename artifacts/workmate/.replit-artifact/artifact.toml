kind = "web"
previewPath = "/"
title = "Karo"
version = "1.0.0"
id = "artifacts/workmate"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23468

[services.development]
run = "pnpm --filter @workspace/workmate run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/workmate", "run", "build" ]
publicDir = "artifacts/workmate/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23468"
BASE_PATH = "/"
